            generateMap(width, height, terrainType) {
                this.hexMap.clear();
                this.mapWidth = width;
                this.mapHeight = height;

                for (let r = 0; r < height; r++) {
                    for (let q = 0; q < width; q++) {
                        const key = `${q},${r}`;
                        let terrain = 'grass';

                        // Generate terrain based on type
                        const noise = Math.random();

                        switch(terrainType) {
                            case 'grassland':
                                if (noise > 0.85) terrain = 'forest';
                                else if (noise > 0.95) terrain = 'water';
                                break;
                            case 'forest':
                                if (noise > 0.4) terrain = 'forest';
                                else if (noise > 0.9) terrain = 'water';
                                break;
                            case 'mountain':
                                if (noise > 0.6) terrain = 'mountain';
                                else if (noise > 0.4) terrain = 'stone';
                                else if (noise > 0.9) terrain = 'water';
                                break;
                            case 'castle':
                                terrain = 'stone';
                                if (noise > 0.8) terrain = 'grass';
                                break;
                            case 'battlefield':
                                if (noise > 0.7) terrain = 'sand';
                                else if (noise > 0.85) terrain = 'forest';
                                break;
                        }

                        // Ensure spawn areas are accessible
                        if (q < 3 || q >= width - 3) {
                            if (terrain === 'water' || terrain === 'mountain') {
                                terrain = 'grass';
                            }
                        }

                        this.hexMap.set(key, {
                            q, r,
                            terrain: TerrainTypes[terrain],
                            terrainKey: terrain
                        });
                    }
                }
            }

            spawnUnits(mission) {
                this.units = [];
                let id = 1;

                mission.playerUnits.forEach(u => {
                    const unitDef = UnitTypes[u.type];
                    this.units.push({
                        id: id++,
                        ...unitDef,
                        unitType: u.type,
                        q: u.q,
                        r: u.r,
                        currentHealth: unitDef.health,
                        maxHealth: unitDef.health,
                        moved: false,
                        attacked: false,
                        team: 'player',
                        cooldowns: {},
                        buffs: []
                    });
                });

                mission.enemyUnits.forEach(u => {
                    const unitDef = UnitTypes[u.type];
                    this.units.push({
                        id: id++,
                        ...unitDef,
                        unitType: u.type,
                        q: u.q,
                        r: u.r,
                        currentHealth: unitDef.health,
                        maxHealth: unitDef.health,
                        moved: false,
                        attacked: false,
                        team: 'enemy',
                        cooldowns: {},
                        buffs: []
                    });
                });

                this.turnCount = 1;
                this.currentTurn = 'player';
                this.gameStats = { kills: 0, turns: 0 };
            }

            centerCamera() {
                const centerQ = this.mapWidth / 2;
                const centerR = this.mapHeight / 2;
                const center = HexUtils.axialToPixel(centerQ, centerR);

                this.camera.x = this.width / 2 - center.x;
                this.camera.y = this.height / 2 - center.y;
            }

            handleClick(e) {
                if (this.currentTurn !== 'player' || this.isAnimating) return;

                const rect = this.canvas.getBoundingClientRect();
                const screenX = e.clientX - rect.left;
                const screenY = e.clientY - rect.top;

                const worldX = (screenX - this.camera.x) / this.camera.zoom;
                const worldY = (screenY - this.camera.y) / this.camera.zoom;

                const hex = HexUtils.pixelToAxial(worldX, worldY);
                const key = `${hex.q},${hex.r}`;

                if (!this.hexMap.has(key)) return;

                // Check if clicking on a unit
                const clickedUnit = this.units.find(u => u.q === hex.q && u.r === hex.r);

                // If ability is selected, check for valid ability target FIRST
                if (this.selectedUnit && this.selectedAbility) {
                    const abilityTarget = this.abilityTargets.find(t => t.q === hex.q && t.r === hex.r);
                    if (abilityTarget) {
                        this.useAbility(this.selectedAbility, abilityTarget);
                        return;
                    } else {
                        // Invalid ability target - show feedback and cancel
                        this.addLogEntry('Invalid target for ability', 'info');
                        this.selectedAbility = null;
                        this.abilityTargets = [];
                        return;
                    }
                }

                if (clickedUnit && clickedUnit.team === 'player' && !clickedUnit.moved && !clickedUnit.attacked) {
                    // Select unit
                    this.selectUnit(clickedUnit);
                    playSound('select');
                } else if (this.selectedUnit) {
                    // Check for valid move
                    const moveTarget = this.validMoves.find(m => m.q === hex.q && m.r === hex.r);
                    if (moveTarget) {
                        this.moveUnit(this.selectedUnit, hex);
                        return;
                    }

                    // Check for valid attack
                    const attackTarget = this.validAttacks.find(a => a.q === hex.q && a.r === hex.r);
                    if (attackTarget && clickedUnit && clickedUnit.team === 'enemy') {
                        this.attackUnit(this.selectedUnit, clickedUnit);
                        return;
                    }

                    // Deselect
                    this.deselectUnit();
                }
            }

            handleMouseMove(e) {
                const rect = this.canvas.getBoundingClientRect();
                const screenX = e.clientX - rect.left;
                const screenY = e.clientY - rect.top;

                if (this.isDragging) {
                    const dx = screenX - this.lastMouse.x;
                    const dy = screenY - this.lastMouse.y;
                    this.camera.x += dx;
                    this.camera.y += dy;
                }

                this.lastMouse = { x: screenX, y: screenY };

                const worldX = (screenX - this.camera.x) / this.camera.zoom;
                const worldY = (screenY - this.camera.y) / this.camera.zoom;
                this.hoveredHex = HexUtils.pixelToAxial(worldX, worldY);
            }

            handleMouseDown(e) {
                if (e.button === 0) {
                    this.isDragging = true;
                }
            }

            handleMouseUp() {
                this.isDragging = false;
            }

            handleWheel(e) {
                e.preventDefault();
                const zoomFactor = e.deltaY > 0 ? 0.9 : 1.1;
                this.camera.zoom = Math.max(0.5, Math.min(2, this.camera.zoom * zoomFactor));
            }

            selectUnit(unit) {
                this.selectedUnit = unit;
                this.selectedAbility = null;
                this.abilityTargets = [];
                this.calculateValidMoves(unit);
                this.calculateValidAttacks(unit);
                this.updateUnitPanel(unit);
                document.getElementById('unitPanel').classList.add('visible');
            }

            deselectUnit() {
                this.selectedUnit = null;
                this.selectedAbility = null;
                this.abilityTargets = [];
                this.validMoves = [];
                this.validAttacks = [];
                document.getElementById('unitPanel').classList.remove('visible');
            }

            calculateValidMoves(unit) {
                this.validMoves = [];
                if (unit.moved) return;

                const visited = new Set();
                const queue = [{ q: unit.q, r: unit.r, cost: 0 }];
                visited.add(`${unit.q},${unit.r}`);

                while (queue.length > 0) {
                    const current = queue.shift();

                    if (current.cost > 0 && current.cost <= unit.movement) {
                        // Check if hex is not occupied
                        const occupied = this.units.some(u => u.q === current.q && u.r === current.r);
                        if (!occupied) {
                            this.validMoves.push({ q: current.q, r: current.r });
                        }
                    }

                    if (current.cost < unit.movement) {
                        const neighbors = HexUtils.neighbors(current.q, current.r);
                        for (const n of neighbors) {
                            const key = `${n.q},${n.r}`;
                            if (visited.has(key)) continue;

                            const hex = this.hexMap.get(key);
                            if (!hex) continue;

                            const moveCost = hex.terrain.moveCost;
                            if (moveCost === Infinity) continue;

                            const newCost = current.cost + moveCost;
                            if (newCost <= unit.movement) {
                                visited.add(key);
                                queue.push({ q: n.q, r: n.r, cost: newCost });
                            }
                        }
                    }
                }
            }

            calculateValidAttacks(unit) {
                this.validAttacks = [];
                if (unit.attacked) return;

                for (const target of this.units) {
                    if (target.team === unit.team) continue;

                    const dist = HexUtils.distance({ q: unit.q, r: unit.r }, { q: target.q, r: target.r });
                    if (dist <= unit.range) {
                        this.validAttacks.push({ q: target.q, r: target.r });
                    }
                }
            }

            async moveUnit(unit, target) {
                playSound('move');
                this.isAnimating = true;

                // Animate movement
                const startPos = HexUtils.axialToPixel(unit.q, unit.r);
                const endPos = HexUtils.axialToPixel(target.q, target.r);

                const duration = 300;
                const startTime = Date.now();

                const animateMove = () => {
                    const elapsed = Date.now() - startTime;
                    const t = Math.min(1, elapsed / duration);
                    const eased = 1 - Math.pow(1 - t, 3);

                    unit.animX = startPos.x + (endPos.x - startPos.x) * eased;
                    unit.animY = startPos.y + (endPos.y - startPos.y) * eased;

                    if (t < 1) {
                        requestAnimationFrame(animateMove);
                    } else {
                        unit.q = target.q;
                        unit.r = target.r;
                        unit.animX = null;
                        unit.animY = null;
                        unit.moved = true;
                        this.isAnimating = false;

                        this.calculateValidMoves(unit);
                        this.calculateValidAttacks(unit);
                        this.updateUI();
                        this.addLogEntry(`${unit.name} moves`, 'info');
                    }
                };

                animateMove();
            }

            async attackUnit(attacker, defender) {
                playSound('attack');
                this.isAnimating = true;

                // Calculate damage with buff support
                const hex = this.hexMap.get(`${defender.q},${defender.r}`);
                const terrainDefense = hex ? hex.terrain.defenseBonus : 0;

                // Apply attack buffs
                let attackPower = attacker.attack;
                if (attacker.buffs) {
                    attacker.buffs.forEach(buff => {
                        if (buff.type === 'attack') attackPower *= buff.value;
                    });
                }

                // Apply defense buffs
                let defenseValue = defender.defense;
                if (defender.buffs) {
                    defender.buffs.forEach(buff => {
                        if (buff.type === 'defense') defenseValue *= buff.value;
                    });
                }
                const totalDefense = defenseValue + terrainDefense;

                let damage = Math.max(1, attackPower - totalDefense * 0.5);
                damage = Math.floor(damage * (0.9 + Math.random() * 0.2)); // Variance

                defender.currentHealth -= damage;

                // Create damage number
                this.createDamageNumber(defender, damage, 'damage');
                playSound('hit');

                // Create attack particles
                this.createAttackParticles(attacker, defender);

                attacker.attacked = true;
                attacker.moved = true;

                this.addLogEntry(`${attacker.name} deals ${damage} damage to ${defender.name}`, 'damage');

                // Check death
                if (defender.currentHealth <= 0) {
                    setTimeout(() => {
                        playSound('death');
                        this.units = this.units.filter(u => u !== defender);
                        this.gameStats.kills++;
                        this.addLogEntry(`${defender.name} defeated!`, 'special');
                        this.checkVictory();
                    }, 300);
                }

                setTimeout(() => {
                    this.isAnimating = false;
                    this.deselectUnit();
                    this.updateUI();
                }, 400);
            }

            createDamageNumber(unit, value, type) {
                const pos = HexUtils.axialToPixel(unit.q, unit.r);
                const screenX = pos.x * this.camera.zoom + this.camera.x;
                const screenY = pos.y * this.camera.zoom + this.camera.y;

                const elem = document.createElement('div');
                elem.className = `damage-number ${type}`;
                elem.textContent = type === 'damage' ? `-${value}` : `+${value}`;
                elem.style.left = screenX + 'px';
                elem.style.top = screenY + 'px';
                document.body.appendChild(elem);

                setTimeout(() => elem.remove(), 1000);
            }

            createAttackParticles(attacker, defender) {
                const startPos = HexUtils.axialToPixel(attacker.q, attacker.r);
                const endPos = HexUtils.axialToPixel(defender.q, defender.r);

                for (let i = 0; i < 10; i++) {
                    this.particles.push({
                        x: endPos.x + (Math.random() - 0.5) * 30,
                        y: endPos.y + (Math.random() - 0.5) * 30,
                        vx: (Math.random() - 0.5) * 5,
                        vy: (Math.random() - 0.5) * 5,
                        life: 1,
                        color: attacker.color,
                        size: 3 + Math.random() * 4
                    });
                }
            }

            waitUnit() {
                if (this.selectedUnit) {
                    this.selectedUnit.moved = true;
                    this.selectedUnit.attacked = true;
                    this.addLogEntry(`${this.selectedUnit.name} waits`, 'info');
                    this.deselectUnit();
                    this.updateUI();
                }
            }

            endTurn() {
                if (this.currentTurn !== 'player') return;

                playSound('select');
                this.deselectUnit();

                // Reset player units
                this.units.filter(u => u.team === 'player').forEach(u => {
                    u.moved = false;
                    u.attacked = false;
                    u.stunned = false; // Clear stun at turn start
                    // Reduce cooldowns
                    Object.keys(u.cooldowns).forEach(k => {
                        if (u.cooldowns[k] > 0) u.cooldowns[k]--;
                    });
                    // Reduce buff durations and remove expired buffs
                    if (u.buffs) {
                        u.buffs = u.buffs.filter(buff => {
                            buff.turns--;
                            return buff.turns > 0;
                        });
                    }
                });

                this.currentTurn = 'enemy';
                this.turnCount++;
                this.gameStats.turns++;
                this.updateUI();
                this.addLogEntry('Enemy turn', 'info');

                setTimeout(() => this.enemyTurn(), 500);
            }

            async enemyTurn() {
                const enemies = this.units.filter(u => u.team === 'enemy');

                for (const enemy of enemies) {
                    if (this.units.filter(u => u.team === 'player').length === 0) break;

                    // Skip stunned enemies
                    if (enemy.stunned) {
                        this.addLogEntry(`${enemy.name} is stunned!`, 'special');
                        continue;
                    }

                    await this.executeEnemyAI(enemy);
                    await this.sleep(300);
                }

                // Reset enemy units
                enemies.forEach(u => {
                    u.moved = false;
                    u.attacked = false;
                    u.stunned = false; // Clear stun after their turn
                    // Reduce buff durations and remove expired buffs
                    if (u.buffs) {
                        u.buffs = u.buffs.filter(buff => {
                            buff.turns--;
                            return buff.turns > 0;
                        });
                    }
                });

                this.currentTurn = 'player';
                this.updateUI();
                this.addLogEntry('Your turn', 'info');
            }

            async executeEnemyAI(enemy) {
                const players = this.units.filter(u => u.team === 'player');
                if (players.length === 0) return;

                // Find closest player unit
                let closestTarget = null;
                let closestDist = Infinity;

                for (const player of players) {
                    const dist = HexUtils.distance({ q: enemy.q, r: enemy.r }, { q: player.q, r: player.r });
                    if (dist < closestDist) {
                        closestDist = dist;
                        closestTarget = player;
                    }
                }

                if (!closestTarget) return;

                // Can we attack?
                if (closestDist <= enemy.range) {
                    await this.attackUnit(enemy, closestTarget);
                    return;
                }

                // Move toward target
                this.calculateValidMoves(enemy);

                let bestMove = null;
                let bestDist = closestDist;

                for (const move of this.validMoves) {
                    const dist = HexUtils.distance(move, { q: closestTarget.q, r: closestTarget.r });
                    if (dist < bestDist) {
                        bestDist = dist;
                        bestMove = move;
                    }
                }

                if (bestMove) {
                    await new Promise(resolve => {
                        const origCallback = () => {
                            resolve();
                        };

                        playSound('move');
                        const startPos = HexUtils.axialToPixel(enemy.q, enemy.r);
                        const endPos = HexUtils.axialToPixel(bestMove.q, bestMove.r);

                        const duration = 300;
                        const startTime = Date.now();

                        const animateMove = () => {
                            const elapsed = Date.now() - startTime;
                            const t = Math.min(1, elapsed / duration);
                            const eased = 1 - Math.pow(1 - t, 3);

                            enemy.animX = startPos.x + (endPos.x - startPos.x) * eased;
                            enemy.animY = startPos.y + (endPos.y - startPos.y) * eased;

                            if (t < 1) {
                                requestAnimationFrame(animateMove);
                            } else {
                                enemy.q = bestMove.q;
                                enemy.r = bestMove.r;
                                enemy.animX = null;
                                enemy.animY = null;
                                enemy.moved = true;

                                // Check if can attack after move
                                const newDist = HexUtils.distance({ q: enemy.q, r: enemy.r }, { q: closestTarget.q, r: closestTarget.r });
                                if (newDist <= enemy.range) {
                                    setTimeout(async () => {
                                        await this.attackUnit(enemy, closestTarget);
                                        resolve();
                                    }, 200);
                                } else {
                                    resolve();
                                }
                            }
                        };

                        animateMove();
                    });
                }
            }

            sleep(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }

            checkVictory() {
                const players = this.units.filter(u => u.team === 'player');
                const enemies = this.units.filter(u => u.team === 'enemy');

                if (enemies.length === 0) {
                    this.victory();
                } else if (players.length === 0) {
                    this.defeat();
                }
            }

            victory() {
                playSound('victory');

                if (this.currentMission && this.currentMission.id) {
                    this.completedMissions.add(this.currentMission.id);
                }

                document.getElementById('resultTitle').textContent = 'VICTORY';
                document.getElementById('resultTitle').className = 'result-title victory';
                document.getElementById('resultSubtitle').textContent = 'The battle is won!';

                document.getElementById('statTurns').textContent = this.gameStats.turns;
                document.getElementById('statKills').textContent = this.gameStats.kills;
                document.getElementById('statSurvivors').textContent = this.units.filter(u => u.team === 'player').length;

                document.getElementById('resultScreen').classList.add('visible');
            }

            defeat() {
                playSound('defeat');

                document.getElementById('resultTitle').textContent = 'DEFEAT';
                document.getElementById('resultTitle').className = 'result-title defeat';
                document.getElementById('resultSubtitle').textContent = 'Your forces have fallen...';

                document.getElementById('statTurns').textContent = this.gameStats.turns;
                document.getElementById('statKills').textContent = this.gameStats.kills;
                document.getElementById('statSurvivors').textContent = 0;

                document.getElementById('resultScreen').classList.add('visible');
            }

            continueFromResult() {
                document.getElementById('resultScreen').classList.remove('visible');
                document.getElementById('gameContainer').classList.remove('active');

                if (this.currentMission && this.currentMission.id) {
                    this.showCampaignSelect();
                } else {
                    document.getElementById('mainMenu').classList.remove('hidden');
                }
            }

            retryMission() {
                document.getElementById('resultScreen').classList.remove('visible');

                if (this.currentMission) {
                    this.generateMap(this.currentMission.mapSize.width, this.currentMission.mapSize.height, this.currentMission.terrain);
                    this.spawnUnits(this.currentMission);
                    this.centerCamera();
                    this.updateUI();
                }
            }

            returnToMenu() {
                document.getElementById('gameContainer').classList.remove('active');
                document.getElementById('mainMenu').classList.remove('hidden');
                this.deselectUnit();
            }

            updateUI() {
                document.getElementById('turnText').textContent = this.currentTurn === 'player' ? 'YOUR TURN' : 'ENEMY TURN';
                document.getElementById('turnCount').textContent = `Turn ${this.turnCount}`;
                document.getElementById('playerUnits').textContent = this.units.filter(u => u.team === 'player').length;
                document.getElementById('enemyUnits').textContent = this.units.filter(u => u.team === 'enemy').length;
            }

            updateUnitPanel(unit) {
                document.getElementById('unitPortrait').textContent = unit.icon;
                document.getElementById('unitPortrait').style.background = unit.color + '33';
                document.getElementById('unitPortrait').style.borderColor = unit.color;
                document.getElementById('unitName').textContent = unit.name;
                document.getElementById('unitType').textContent = unit.type;

                document.getElementById('healthBar').style.width = (unit.currentHealth / unit.maxHealth * 100) + '%';
                document.getElementById('healthValue').textContent = `${unit.currentHealth}/${unit.maxHealth}`;

                document.getElementById('attackBar').style.width = (unit.attack / 40 * 100) + '%';
                document.getElementById('attackValue').textContent = unit.attack;

                document.getElementById('defenseBar').style.width = (unit.defense / 25 * 100) + '%';
                document.getElementById('defenseValue').textContent = unit.defense;

                document.getElementById('movementBar').style.width = (unit.movement / 5 * 100) + '%';
                document.getElementById('movementValue').textContent = unit.movement;

                // Abilities
                const abilityList = document.getElementById('abilityList');
                abilityList.innerHTML = '';

                unit.abilities.forEach(abilityKey => {
                    const ability = Abilities[abilityKey];
                    const btn = document.createElement('button');
                    btn.className = 'ability-btn';
                    btn.textContent = ability.name;
                    btn.dataset.ability = abilityKey;

                    const cooldown = unit.cooldowns[abilityKey] || 0;
                    if (cooldown > 0) {
                        btn.textContent += ` (${cooldown})`;
                        btn.disabled = true;
                    }

                    // Disable if unit already attacked (for attack abilities)
                    if (unit.attacked && (ability.type === 'attack' || ability.type === 'special')) {
                        btn.disabled = true;
                    }

                    btn.title = ability.desc;

                    // Add click handler
                    btn.addEventListener('click', () => {
                        if (!btn.disabled) {
                            this.selectAbility(abilityKey);
                        }
                    });

                    // Highlight if selected
                    if (this.selectedAbility === abilityKey) {
                        btn.classList.add('selected');
                    }

                    abilityList.appendChild(btn);
                });
            }

            selectAbility(abilityKey) {
                const ability = Abilities[abilityKey];

                if (this.selectedAbility === abilityKey) {
                    // Deselect
                    this.selectedAbility = null;
                    this.abilityTargets = [];
                    playSound('select');
                } else {
                    this.selectedAbility = abilityKey;
                    this.calculateAbilityTargets(abilityKey);
                    playSound('select');
                }

                this.updateUnitPanel(this.selectedUnit);
                this.addLogEntry(`Selected: ${ability.name}`, 'info');
            }

            calculateAbilityTargets(abilityKey) {
                const ability = Abilities[abilityKey];
                const unit = this.selectedUnit;
                this.abilityTargets = [];

                if (!unit) return;

                const range = ability.range || unit.range;

                if (ability.type === 'heal' || ability.type === 'buff') {
                    // Target friendly units (including self for some)
                    for (const target of this.units) {
                        if (target.team !== unit.team) continue;
                        const dist = HexUtils.distance({ q: unit.q, r: unit.r }, { q: target.q, r: target.r });
                        if (dist <= range) {
                            // For heal, only target damaged units
                            if (ability.type === 'heal' && target.currentHealth >= target.maxHealth) continue;
                            this.abilityTargets.push({ q: target.q, r: target.r });
                        }
                    }
                } else if (ability.type === 'attack' || ability.type === 'special') {
                    // Target enemy units
                    for (const target of this.units) {
                        if (target.team === unit.team) continue;
                        const dist = HexUtils.distance({ q: unit.q, r: unit.r }, { q: target.q, r: target.r });
                        if (dist <= range) {
                            this.abilityTargets.push({ q: target.q, r: target.r });
                        }
                    }
                }
            }

            async useAbility(abilityKey, target) {
                const ability = Abilities[abilityKey];
                const unit = this.selectedUnit;

                if (!unit || !ability) return;

                this.isAnimating = true;

                if (ability.type === 'heal') {
                    // Healing ability
                    const targetUnit = this.units.find(u => u.q === target.q && u.r === target.r);
                    if (targetUnit) {
                        const healAmount = ability.healing || 30;
                        const actualHeal = Math.min(healAmount, targetUnit.maxHealth - targetUnit.currentHealth);
                        targetUnit.currentHealth += actualHeal;

                        playSound('heal');
                        this.createDamageNumber(targetUnit, actualHeal, 'heal');
                        this.createHealParticles(targetUnit);
                        this.addLogEntry(`${unit.name} heals ${targetUnit.name} for ${actualHeal}`, 'heal');
                    }
                } else if (ability.type === 'buff') {
                    // Buff ability
                    const targetUnit = this.units.find(u => u.q === target.q && u.r === target.r);
                    if (targetUnit) {
                        targetUnit.buffs.push({ type: ability.buff, turns: 2, value: 1.5 });
                        playSound('heal');
                        this.addLogEntry(`${unit.name} casts ${ability.name} on ${targetUnit.name}`, 'special');
                    }
                } else if (ability.type === 'attack' || ability.type === 'special') {
                    // Damage ability
                    const targetUnit = this.units.find(u => u.q === target.q && u.r === target.r);
                    if (targetUnit) {
                        playSound('attack');

                        // Apply attack buffs
                        let attackPower = unit.attack;
                        if (unit.buffs) {
                            unit.buffs.forEach(buff => {
                                if (buff.type === 'attack') attackPower *= buff.value;
                            });
                        }

                        let damage = attackPower * (ability.damage || 1);

                        // Apply defense buffs
                        let defenseValue = targetUnit.defense;
                        if (targetUnit.buffs) {
                            targetUnit.buffs.forEach(buff => {
                                if (buff.type === 'defense') defenseValue *= buff.value;
                            });
                        }

                        // Special ability effects
                        if (abilityKey === 'piercing_shot') {
                            // Piercing Shot ignores 50% of defense
                            const hex = this.hexMap.get(`${targetUnit.q},${targetUnit.r}`);
                            const terrainDefense = hex ? hex.terrain.defenseBonus : 0;
                            damage = Math.max(1, damage - (defenseValue + terrainDefense) * 0.25);
                        } else {
                            const hex = this.hexMap.get(`${targetUnit.q},${targetUnit.r}`);
                            const terrainDefense = hex ? hex.terrain.defenseBonus : 0;
                            damage = Math.max(1, damage - (defenseValue + terrainDefense) * 0.5);
                        }

                        damage = Math.floor(damage * (0.9 + Math.random() * 0.2));
                        targetUnit.currentHealth -= damage;

                        playSound('hit');
                        this.createDamageNumber(targetUnit, damage, 'damage');
                        this.createAttackParticles(unit, targetUnit);
                        this.addLogEntry(`${unit.name} uses ${ability.name} for ${damage} damage`, 'damage');

                        // Shield Bash - stun the target
                        if (abilityKey === 'shield_bash') {
                            targetUnit.stunned = true;
                            this.addLogEntry(`${targetUnit.name} is stunned!`, 'special');
                        }

                        // Charge - move to adjacent hex of target
                        if (abilityKey === 'charge') {
                            const neighbors = HexUtils.neighbors(targetUnit.q, targetUnit.r);
                            // Find an empty adjacent hex
                            for (const n of neighbors) {
                                const occupied = this.units.some(u => u.q === n.q && u.r === n.r);
                                const hex = this.hexMap.get(`${n.q},${n.r}`);
                                if (!occupied && hex && hex.terrain.movementCost < 99) {
                                    unit.q = n.q;
                                    unit.r = n.r;
                                    this.addLogEntry(`${unit.name} charges forward!`, 'special');
                                    break;
                                }
                            }
                        }

                        // Check death
                        if (targetUnit.currentHealth <= 0) {
                            setTimeout(() => {
                                playSound('death');
                                this.units = this.units.filter(u => u !== targetUnit);
                                this.gameStats.kills++;
                                this.addLogEntry(`${targetUnit.name} defeated!`, 'special');
                                this.checkVictory();
                            }, 300);
                        }

                        // Frost Nova - damage adjacent enemies too
                        if (abilityKey === 'frost_nova') {
                            const neighbors = HexUtils.neighbors(targetUnit.q, targetUnit.r);
                            for (const n of neighbors) {
                                const adjEnemy = this.units.find(u => u.q === n.q && u.r === n.r && u.team === 'enemy');
                                if (adjEnemy) {
                                    const adjDamage = Math.floor(damage * 0.5);
                                    adjEnemy.currentHealth -= adjDamage;
                                    this.createDamageNumber(adjEnemy, adjDamage, 'damage');
                                    if (adjEnemy.currentHealth <= 0) {
                                        setTimeout(() => {
                                            this.units = this.units.filter(u => u !== adjEnemy);
                                            this.gameStats.kills++;
                                        }, 400);
                                    }
                                }
                            }
                        }
                    }
                }

                // Set cooldown
                if (ability.cooldown) {
                    unit.cooldowns[abilityKey] = ability.cooldown;
                }

                // Mark as attacked for damage abilities
                if (ability.type === 'attack' || ability.type === 'special') {
                    unit.attacked = true;
                    unit.moved = true;
                }

                // Clear selection
                this.selectedAbility = null;
                this.abilityTargets = [];

                setTimeout(() => {
                    this.isAnimating = false;
                    if (this.selectedUnit) {
                        this.updateUnitPanel(this.selectedUnit);
                    }
                    this.updateUI();
                }, 400);
            }

            createHealParticles(unit) {
                const pos = HexUtils.axialToPixel(unit.q, unit.r);
                for (let i = 0; i < 15; i++) {
                    this.particles.push({
                        x: pos.x + (Math.random() - 0.5) * 30,
                        y: pos.y + (Math.random() - 0.5) * 30,
                        vx: (Math.random() - 0.5) * 2,
                        vy: -2 - Math.random() * 2,
                        life: 1,
                        color: '#2ecc71',
                        size: 3 + Math.random() * 3
                    });
                }
            }

            addLogEntry(text, type = '') {
                const log = document.getElementById('combatLog');
                const entry = document.createElement('div');
                entry.className = `log-entry ${type}`;
                entry.textContent = text;
                log.insertBefore(entry, log.firstChild);

                // Keep only last 10 entries
                while (log.children.length > 10) {
                    log.removeChild(log.lastChild);
                }
            }

            draw() {
                this.ctx.fillStyle = '#0a0a15';
                this.ctx.fillRect(0, 0, this.width, this.height);

                this.ctx.save();
                this.ctx.translate(this.camera.x, this.camera.y);
                this.ctx.scale(this.camera.zoom, this.camera.zoom);

                // Draw hexes
                this.hexMap.forEach((hex, key) => {
                    this.drawHex(hex);
                });

                // Draw valid moves
                this.validMoves.forEach(move => {
                    const pos = HexUtils.axialToPixel(move.q, move.r);
                    this.ctx.fillStyle = 'rgba(52, 152, 219, 0.3)';
                    this.ctx.beginPath();
                    const corners = HexUtils.hexCorners(pos.x, pos.y);
                    this.ctx.moveTo(corners[0].x, corners[0].y);
                    corners.forEach(c => this.ctx.lineTo(c.x, c.y));
                    this.ctx.fill();
                });

                // Draw valid attacks
                this.validAttacks.forEach(attack => {
                    const pos = HexUtils.axialToPixel(attack.q, attack.r);
                    this.ctx.fillStyle = 'rgba(231, 76, 60, 0.3)';
                    this.ctx.beginPath();
                    const corners = HexUtils.hexCorners(pos.x, pos.y);
                    this.ctx.moveTo(corners[0].x, corners[0].y);
                    corners.forEach(c => this.ctx.lineTo(c.x, c.y));
                    this.ctx.fill();
                });

                // Draw ability targets
                if (this.selectedAbility && this.abilityTargets.length > 0) {
                    const ability = Abilities[this.selectedAbility];
                    const isHealOrBuff = ability.type === 'heal' || ability.type === 'buff';
                    const targetColor = isHealOrBuff ? 'rgba(46, 204, 113, 0.4)' : 'rgba(155, 89, 182, 0.4)';
                    const glowColor = isHealOrBuff ? 'rgba(46, 204, 113, 0.6)' : 'rgba(155, 89, 182, 0.6)';

                    this.abilityTargets.forEach(target => {
                        const pos = HexUtils.axialToPixel(target.q, target.r);
                        const corners = HexUtils.hexCorners(pos.x, pos.y);

                        // Fill
                        this.ctx.fillStyle = targetColor;
                        this.ctx.beginPath();
                        this.ctx.moveTo(corners[0].x, corners[0].y);
                        corners.forEach(c => this.ctx.lineTo(c.x, c.y));
                        this.ctx.fill();

                        // Glowing border
                        this.ctx.strokeStyle = glowColor;
                        this.ctx.lineWidth = 3;
                        this.ctx.stroke();
                    });
                }

                // Draw units
                this.units.forEach(unit => {
                    this.drawUnit(unit);
                });

                // Draw particles
                this.particles.forEach((p, i) => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= 0.02;

                    if (p.life > 0) {
                        this.ctx.globalAlpha = p.life;
                        this.ctx.fillStyle = p.color;
                        this.ctx.beginPath();
                        this.ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                        this.ctx.fill();
                        this.ctx.globalAlpha = 1;
                    }
                });

                this.particles = this.particles.filter(p => p.life > 0);

                this.ctx.restore();

                // Draw minimap
                this.drawMinimap();
            }

            drawHex(hex) {
                const pos = HexUtils.axialToPixel(hex.q, hex.r);
                const corners = HexUtils.hexCorners(pos.x, pos.y);

                // Fill
                this.ctx.fillStyle = hex.terrain.color;
                this.ctx.beginPath();
                this.ctx.moveTo(corners[0].x, corners[0].y);
                corners.forEach(c => this.ctx.lineTo(c.x, c.y));
                this.ctx.closePath();
                this.ctx.fill();

                // Stroke
                this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                this.ctx.lineWidth = 1;
                this.ctx.stroke();

                // Hover effect
                if (this.hoveredHex && this.hoveredHex.q === hex.q && this.hoveredHex.r === hex.r) {
                    this.ctx.fillStyle = 'rgba(255, 215, 0, 0.15)';
                    this.ctx.fill();
                }

                // Selected unit highlight
                if (this.selectedUnit && this.selectedUnit.q === hex.q && this.selectedUnit.r === hex.r) {
                    this.ctx.strokeStyle = '#ffd700';
                    this.ctx.lineWidth = 3;
                    this.ctx.stroke();
                }
            }

            drawUnit(unit) {
                const x = unit.animX !== null && unit.animX !== undefined ? unit.animX : HexUtils.axialToPixel(unit.q, unit.r).x;
                const y = unit.animY !== null && unit.animY !== undefined ? unit.animY : HexUtils.axialToPixel(unit.q, unit.r).y;

                // Unit circle
                this.ctx.fillStyle = unit.team === 'player' ? unit.color : '#8b0000';
                this.ctx.beginPath();
                this.ctx.arc(x, y, 20, 0, Math.PI * 2);
                this.ctx.fill();

                // Border
                this.ctx.strokeStyle = unit.team === 'player' ? '#fff' : '#500';
                this.ctx.lineWidth = 2;
                this.ctx.stroke();

                // Icon
                this.ctx.fillStyle = '#fff';
                this.ctx.font = '20px Arial';
                this.ctx.textAlign = 'center';
                this.ctx.textBaseline = 'middle';
                this.ctx.fillText(unit.icon, x, y);

                // Health bar
                const barWidth = 30;
                const barHeight = 4;
                const healthPercent = unit.currentHealth / unit.maxHealth;

                this.ctx.fillStyle = '#333';
                this.ctx.fillRect(x - barWidth / 2, y + 25, barWidth, barHeight);

                this.ctx.fillStyle = healthPercent > 0.5 ? '#2ecc71' : healthPercent > 0.25 ? '#f39c12' : '#e74c3c';
                this.ctx.fillRect(x - barWidth / 2, y + 25, barWidth * healthPercent, barHeight);

                // Status indicators
                if (unit.team === 'player') {
                    if (unit.moved && unit.attacked) {
                        this.ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                        this.ctx.beginPath();
                        this.ctx.arc(x, y, 20, 0, Math.PI * 2);
                        this.ctx.fill();
                    }
                }
            }

            drawMinimap() {
                const ctx = this.minimapCtx;
                ctx.fillStyle = '#1a1a2e';
                ctx.fillRect(0, 0, 180, 140);

                const scale = 8;
                const offsetX = 20;
                const offsetY = 20;

                // Draw hexes
                this.hexMap.forEach(hex => {
                    const x = offsetX + hex.q * scale + hex.r * scale * 0.5;
                    const y = offsetY + hex.r * scale * 0.75;

                    ctx.fillStyle = hex.terrain.color;
                    ctx.fillRect(x, y, scale - 1, scale - 1);
                });

                // Draw units
                this.units.forEach(unit => {
                    const x = offsetX + unit.q * scale + unit.r * scale * 0.5;
                    const y = offsetY + unit.r * scale * 0.75;

                    ctx.fillStyle = unit.team === 'player' ? '#3498db' : '#e74c3c';
                    ctx.beginPath();
                    ctx.arc(x + scale / 2, y + scale / 2, 3, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            animate() {
                this.draw();
                requestAnimationFrame(() => this.animate());
            }
        }

        // Initialize game
        window.addEventListener('DOMContentLoaded', () => {
            window.game = new Emberfall();
        });
    </script>
</body>
</html>
