<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emberfall - Tactical Strategy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #1a1a2e;
            --bg-darker: #0f0f1a;
            --bg-panel: rgba(20, 20, 40, 0.95);
            --border: rgba(255, 215, 100, 0.2);
            --border-bright: rgba(255, 215, 100, 0.5);
            --text: #e8e8f0;
            --text-muted: rgba(232, 232, 240, 0.6);
            --gold: #ffd700;
            --gold-dim: rgba(255, 215, 0, 0.3);
            --red: #e74c3c;
            --green: #2ecc71;
            --blue: #3498db;
            --purple: #9b59b6;
            --orange: #e67e22;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-darker);
            color: var(--text);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* Main Menu */
        .main-menu {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f1a 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .main-menu.hidden {
            display: none;
        }

        .menu-bg {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        .menu-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--gold);
            border-radius: 50%;
            opacity: 0.3;
            animation: float 20s infinite linear;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.3; }
            90% { opacity: 0.3; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }

        .menu-content {
            position: relative;
            z-index: 10;
            text-align: center;
        }

        .game-title {
            font-family: 'Cinzel', serif;
            font-size: 5rem;
            font-weight: 700;
            color: var(--gold);
            text-shadow: 0 0 60px rgba(255, 215, 0, 0.5), 0 4px 20px rgba(0, 0, 0, 0.8);
            letter-spacing: 0.15em;
            margin-bottom: 10px;
        }

        .game-subtitle {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            color: var(--text-muted);
            letter-spacing: 0.4em;
            margin-bottom: 60px;
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }

        .menu-btn {
            width: 280px;
            padding: 18px 40px;
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.2) 0%, rgba(255, 215, 0, 0.05) 100%);
            border: 2px solid var(--border);
            color: var(--gold);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .menu-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .menu-btn:hover {
            border-color: var(--gold);
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(255, 215, 0, 0.3);
        }

        .menu-btn:hover::before {
            left: 100%;
        }

        .menu-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Game Canvas Container */
        .game-container {
            position: fixed;
            inset: 0;
            display: none;
        }

        .game-container.active {
            display: block;
        }

        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Top Bar */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: linear-gradient(to bottom, var(--bg-panel), transparent);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            z-index: 100;
        }

        .turn-indicator {
            font-family: 'Cinzel', serif;
            font-size: 1.3rem;
            color: var(--gold);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .turn-badge {
            padding: 6px 16px;
            background: var(--gold-dim);
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .battle-info {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .info-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Unit Panel */
        .unit-panel {
            position: fixed;
            bottom: 24px;
            left: 24px;
            width: 320px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            z-index: 100;
            display: none;
        }

        .unit-panel.visible {
            display: block;
        }

        .unit-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .unit-portrait {
            width: 64px;
            height: 64px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            border: 2px solid var(--border);
        }

        .unit-info h3 {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            color: var(--gold);
            margin-bottom: 4px;
        }

        .unit-info .unit-type {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .stat-bars {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        .stat-bar {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stat-label {
            width: 70px;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .stat-track {
            flex: 1;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .stat-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .stat-fill.health { background: linear-gradient(90deg, #e74c3c, #c0392b); }
        .stat-fill.attack { background: linear-gradient(90deg, #e67e22, #d35400); }
        .stat-fill.defense { background: linear-gradient(90deg, #3498db, #2980b9); }
        .stat-fill.movement { background: linear-gradient(90deg, #2ecc71, #27ae60); }

        .stat-value {
            width: 40px;
            text-align: right;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .abilities-section h4 {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 10px;
        }

        .ability-list {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .ability-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .ability-btn:hover {
            background: var(--gold-dim);
            border-color: var(--gold);
        }

        .ability-btn.selected {
            background: var(--gold-dim);
            border-color: var(--gold);
            color: var(--gold);
        }

        .ability-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Action Bar */
        .action-bar {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 100;
        }

        .action-btn {
            padding: 14px 28px;
            font-family: 'Cinzel', serif;
            font-size: 0.95rem;
            font-weight: 600;
            background: var(--bg-panel);
            border: 2px solid var(--border);
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: 8px;
        }

        .action-btn:hover {
            border-color: var(--gold);
            color: var(--gold);
            transform: translateY(-2px);
        }

        .action-btn.primary {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.3), rgba(255, 215, 0, 0.1));
            border-color: var(--gold);
            color: var(--gold);
        }

        .action-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        /* Minimap */
        .minimap {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 180px;
            height: 140px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            z-index: 100;
        }

        .minimap canvas {
            width: 100%;
            height: 100%;
        }

        /* Combat Log */
        .combat-log {
            position: fixed;
            top: 70px;
            right: 24px;
            width: 280px;
            max-height: 200px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            overflow-y: auto;
            z-index: 100;
            font-size: 0.8rem;
        }

        .log-entry {
            padding: 6px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .log-entry.damage { color: var(--red); }
        .log-entry.heal { color: var(--green); }
        .log-entry.info { color: var(--blue); }
        .log-entry.special { color: var(--purple); }

        /* Victory/Defeat Screen */
        .result-screen {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 500;
            backdrop-filter: blur(10px);
        }

        .result-screen.visible {
            display: flex;
        }

        .result-content {
            text-align: center;
        }

        .result-title {
            font-family: 'Cinzel', serif;
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-shadow: 0 0 60px currentColor;
        }

        .result-title.victory {
            color: var(--gold);
        }

        .result-title.defeat {
            color: var(--red);
        }

        .result-subtitle {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 40px;
        }

        .result-stats {
            display: flex;
            gap: 40px;
            justify-content: center;
            margin-bottom: 40px;
        }

        .result-stat {
            text-align: center;
        }

        .result-stat-value {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            color: var(--gold);
        }

        .result-stat-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* Campaign Select */
        .campaign-select {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f1a 100%);
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 60px;
            z-index: 900;
            overflow-y: auto;
        }

        .campaign-select.visible {
            display: flex;
        }

        .campaign-title {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            color: var(--gold);
            margin-bottom: 40px;
        }

        .mission-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            max-width: 1200px;
            width: 100%;
        }

        .mission-card {
            background: var(--bg-panel);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .mission-card:hover {
            border-color: var(--gold);
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .mission-card.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .mission-card.completed {
            border-color: var(--green);
        }

        .mission-number {
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .mission-name {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            color: var(--gold);
            margin-bottom: 12px;
        }

        .mission-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 16px;
        }

        .mission-difficulty {
            display: flex;
            gap: 4px;
        }

        .difficulty-pip {
            width: 12px;
            height: 12px;
            border-radius: 2px;
            background: var(--border);
        }

        .difficulty-pip.filled {
            background: var(--gold);
        }

        .back-btn {
            position: fixed;
            top: 24px;
            left: 24px;
            padding: 12px 24px;
            font-family: 'Cinzel', serif;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            color: var(--text);
            cursor: pointer;
            border-radius: 6px;
            z-index: 950;
        }

        .back-btn:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        /* Tooltip */
        .tooltip {
            position: fixed;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            max-width: 250px;
            z-index: 600;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .tooltip.visible {
            opacity: 1;
        }

        .tooltip-title {
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            color: var(--gold);
            margin-bottom: 6px;
        }

        .tooltip-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* Loading Screen */
        .loading-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-darker);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .loading-screen.hidden {
            display: none;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 3px solid var(--border);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-family: 'Cinzel', serif;
            color: var(--text-muted);
            letter-spacing: 0.2em;
        }

        /* Damage Numbers */
        .damage-number {
            position: fixed;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 1.5rem;
            pointer-events: none;
            z-index: 400;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            animation: damageFloat 1s ease-out forwards;
        }

        .damage-number.damage { color: var(--red); }
        .damage-number.heal { color: var(--green); }
        .damage-number.miss { color: var(--text-muted); }

        @keyframes damageFloat {
            0% { transform: translateY(0) scale(0.5); opacity: 1; }
            50% { transform: translateY(-30px) scale(1.2); }
            100% { transform: translateY(-60px) scale(1); opacity: 0; }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-spinner"></div>
        <div class="loading-text">LOADING</div>
    </div>

    <!-- Main Menu -->
    <div class="main-menu" id="mainMenu">
        <div class="menu-bg" id="menuBg"></div>
        <div class="menu-content">
            <h1 class="game-title">EMBERFALL</h1>
            <p class="game-subtitle">TACTICAL STRATEGY</p>
            <div class="menu-buttons">
                <button class="menu-btn" id="campaignBtn">CAMPAIGN</button>
                <button class="menu-btn" id="skirmishBtn">SKIRMISH</button>
                <button class="menu-btn" id="tutorialBtn">HOW TO PLAY</button>
            </div>
        </div>
    </div>

    <!-- Campaign Select -->
    <div class="campaign-select" id="campaignSelect">
        <button class="back-btn" id="campaignBackBtn">← BACK</button>
        <h2 class="campaign-title">SELECT MISSION</h2>
        <div class="mission-grid" id="missionGrid"></div>
    </div>

    <!-- Game Container -->
    <div class="game-container" id="gameContainer">
        <canvas id="gameCanvas"></canvas>

        <!-- Top Bar -->
        <div class="top-bar">
            <div class="turn-indicator">
                <span id="turnText">YOUR TURN</span>
                <span class="turn-badge" id="turnCount">Turn 1</span>
            </div>
            <div class="battle-info">
                <div class="info-item">
                    <span class="info-icon">⚔️</span>
                    <span>Units: <strong id="playerUnits">0</strong></span>
                </div>
                <div class="info-item">
                    <span class="info-icon">💀</span>
                    <span>Enemy: <strong id="enemyUnits">0</strong></span>
                </div>
            </div>
        </div>

        <!-- Unit Panel -->
        <div class="unit-panel" id="unitPanel">
            <div class="unit-header">
                <div class="unit-portrait" id="unitPortrait">⚔️</div>
                <div class="unit-info">
                    <h3 id="unitName">Warrior</h3>
                    <span class="unit-type" id="unitType">Melee Fighter</span>
                </div>
            </div>
            <div class="stat-bars">
                <div class="stat-bar">
                    <span class="stat-label">Health</span>
                    <div class="stat-track"><div class="stat-fill health" id="healthBar"></div></div>
                    <span class="stat-value" id="healthValue">100</span>
                </div>
                <div class="stat-bar">
                    <span class="stat-label">Attack</span>
                    <div class="stat-track"><div class="stat-fill attack" id="attackBar"></div></div>
                    <span class="stat-value" id="attackValue">15</span>
                </div>
                <div class="stat-bar">
                    <span class="stat-label">Defense</span>
                    <div class="stat-track"><div class="stat-fill defense" id="defenseBar"></div></div>
                    <span class="stat-value" id="defenseValue">10</span>
                </div>
                <div class="stat-bar">
                    <span class="stat-label">Movement</span>
                    <div class="stat-track"><div class="stat-fill movement" id="movementBar"></div></div>
                    <span class="stat-value" id="movementValue">3</span>
                </div>
            </div>
            <div class="abilities-section">
                <h4>Abilities</h4>
                <div class="ability-list" id="abilityList"></div>
            </div>
        </div>

        <!-- Action Bar -->
        <div class="action-bar">
            <button class="action-btn" id="waitBtn">WAIT</button>
            <button class="action-btn primary" id="endTurnBtn">END TURN</button>
            <button class="action-btn" id="menuBtn">MENU</button>
        </div>

        <!-- Combat Log -->
        <div class="combat-log" id="combatLog"></div>

        <!-- Minimap -->
        <div class="minimap">
            <canvas id="minimapCanvas"></canvas>
        </div>
    </div>

    <!-- Result Screen -->
    <div class="result-screen" id="resultScreen">
        <div class="result-content">
            <h1 class="result-title" id="resultTitle">VICTORY</h1>
            <p class="result-subtitle" id="resultSubtitle">The battle is won!</p>
            <div class="result-stats">
                <div class="result-stat">
                    <div class="result-stat-value" id="statTurns">0</div>
                    <div class="result-stat-label">Turns</div>
                </div>
                <div class="result-stat">
                    <div class="result-stat-value" id="statKills">0</div>
                    <div class="result-stat-label">Enemies Slain</div>
                </div>
                <div class="result-stat">
                    <div class="result-stat-value" id="statSurvivors">0</div>
                    <div class="result-stat-label">Survivors</div>
                </div>
            </div>
            <div class="menu-buttons">
                <button class="menu-btn" id="continueBtn">CONTINUE</button>
                <button class="menu-btn" id="retryBtn">RETRY</button>
            </div>
        </div>
    </div>

    <!-- Tooltip -->
    <div class="tooltip" id="tooltip">
        <div class="tooltip-title" id="tooltipTitle"></div>
        <div class="tooltip-desc" id="tooltipDesc"></div>
    </div>

    <script>
        // ============================================
        // EMBERFALL - Tactical Strategy Game
        // ============================================

        // Audio Context for sound effects
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioCtx();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            switch(type) {
                case 'select':
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                    break;
                case 'move':
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(400, now + 0.15);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                    break;
                case 'attack':
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(80, now + 0.2);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                    break;
                case 'hit':
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.exponentialRampToValueAtTime(50, now + 0.15);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                    break;
                case 'heal':
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.3);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                    break;
                case 'death':
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(30, now + 0.5);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                    break;
                case 'victory':
                    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.connect(g);
                        g.connect(audioCtx.destination);
                        o.frequency.setValueAtTime(freq, now + i * 0.15);
                        g.gain.setValueAtTime(0.1, now + i * 0.15);
                        g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.15 + 0.4);
                        o.start(now + i * 0.15);
                        o.stop(now + i * 0.15 + 0.4);
                    });
                    break;
                case 'defeat':
                    [200, 180, 150, 100].forEach((freq, i) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.connect(g);
                        g.connect(audioCtx.destination);
                        o.type = 'sawtooth';
                        o.frequency.setValueAtTime(freq, now + i * 0.2);
                        g.gain.setValueAtTime(0.1, now + i * 0.2);
                        g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.2 + 0.3);
                        o.start(now + i * 0.2);
                        o.stop(now + i * 0.2 + 0.3);
                    });
                    break;
            }
        }

        // Hex math utilities
        const HexUtils = {
            size: 40,

            axialToPixel(q, r) {
                const x = this.size * (Math.sqrt(3) * q + Math.sqrt(3) / 2 * r);
                const y = this.size * (3 / 2 * r);
                return { x, y };
            },

            pixelToAxial(x, y) {
                const q = (Math.sqrt(3) / 3 * x - 1 / 3 * y) / this.size;
                const r = (2 / 3 * y) / this.size;
                return this.axialRound(q, r);
            },

            axialRound(q, r) {
                const s = -q - r;
                let rq = Math.round(q);
                let rr = Math.round(r);
                let rs = Math.round(s);

                const qDiff = Math.abs(rq - q);
                const rDiff = Math.abs(rr - r);
                const sDiff = Math.abs(rs - s);

                if (qDiff > rDiff && qDiff > sDiff) {
                    rq = -rr - rs;
                } else if (rDiff > sDiff) {
                    rr = -rq - rs;
                }

                return { q: rq, r: rr };
            },

            distance(a, b) {
                return (Math.abs(a.q - b.q) + Math.abs(a.q + a.r - b.q - b.r) + Math.abs(a.r - b.r)) / 2;
            },

            neighbors(q, r) {
                const directions = [
                    { q: 1, r: 0 }, { q: 1, r: -1 }, { q: 0, r: -1 },
                    { q: -1, r: 0 }, { q: -1, r: 1 }, { q: 0, r: 1 }
                ];
                return directions.map(d => ({ q: q + d.q, r: r + d.r }));
            },

            hexCorners(cx, cy) {
                const corners = [];
                for (let i = 0; i < 6; i++) {
                    const angle = Math.PI / 180 * (60 * i - 30);
                    corners.push({
                        x: cx + this.size * Math.cos(angle),
                        y: cy + this.size * Math.sin(angle)
                    });
                }
                return corners;
            }
        };

        // Main Game Class
        class Emberfall {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.minimapCanvas = document.getElementById('minimapCanvas');
                this.minimapCtx = this.minimapCanvas.getContext('2d');

                this.hexMap = new Map();
                this.units = [];
                this.particles = [];

                this.camera = { x: 0, y: 0, zoom: 1 };
                this.isDragging = false;
                this.lastMouse = { x: 0, y: 0 };

                this.selectedUnit = null;

                document.getElementById('endTurnBtn').addEventListener('click', () => this.endTurn());

                document.getElementById('retryBtn').addEventListener('click', () => this.retryMission());

                this.canvas.addEventListener('click', (e) => this.handleClick(e));
                this.canvas.addEventListener('mousemove', (e) => this.handleMouseMove(e));
                this.canvas.addEventListener('mousedown', (e) => this.handleMouseDown(e));
                this.canvas.addEventListener('mouseup', () => this.handleMouseUp());
                this.canvas.addEventListener('wheel', (e) => this.handleWheel(e));

                document.getElementById('mainMenu').classList.add('hidden');

                // Random skirmish
                const mission = {

                    ],

                this.currentMission = mission;
